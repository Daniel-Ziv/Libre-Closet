primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  APP_NAME = "Libre Closet"
  AUTH_ENABLED = "true"
  PWA_ENABLED = "true"
  SUPPORTER_PROMPT_ENABLED = "false"
  DISABLE_REGISTRATION = "false"
  DATA_PATH = "/data"
  DATABASE_TYPE = "sqlite"
  DATABASE_SCHEMA = "/data/sqlite3.db"
  FILE_STORAGE_TYPE = "local"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/auth/login"
    timeout = "5s"

[[mounts]]
  source = "libre_closet_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
